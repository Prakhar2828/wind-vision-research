name: Portable replay checks
on:
  push:
    paths: ['releases/portable-v1/**', '.github/workflows/portable-replay.yml']
  pull_request:
    paths: ['releases/portable-v1/**', '.github/workflows/portable-replay.yml']
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r releases/portable-v1/requirements.txt
      - run: python -m unittest discover -s tests
        working-directory: releases/portable-v1
